server {
    listen 80;
    listen [::]:80;
    server_name commerce.aicbec.cn;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://commerce.aicbec.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name commerce.aicbec.cn;
    ssl_certificate /etc/letsencrypt/live/commerce.aicbec.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commerce.aicbec.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # OAuth callback query strings contain one-use codes; do not access-log them.
    access_log off;
    error_log /var/log/nginx/yz-commerce-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /api/v1/shopee/callback {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        error_log /dev/null crit;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
        proxy_hide_header X-Powered-By;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
        proxy_hide_header X-Powered-By;
    }
}
