# Enable only this dedicated hostname. Keep the default and teaching sites.
server {
    listen 80;
    listen [::]:80;
    server_name commerce.yanzhiedu.cn;
    access_log off;
    error_log /var/log/nginx/yz-commerce-error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503 'HTTPS setup pending'; add_header Content-Type text/plain; }
}
